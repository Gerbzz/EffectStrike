name: EffectStrike Echo isolation

on:
  pull_request:
    paths:
      - .github/workflows/effectstrike-echo-isolation.yml
      - crates/render/**
      - crates/gpu/**
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUSTUP_TOOLCHAIN: '1.95.0'

jobs:
  verify:
    name: ${{ matrix.check }}
    if: github.repository == 'Gerbzz/EffectStrike'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        check: [focused-render-echo, full-ci]
    steps:
      - name: Check out the exact proposed head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record the exact revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p ci-evidence
          git rev-parse HEAD | tee ci-evidence/head.txt
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Install normal Linux build and software Vulkan dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libgtk-3-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxcb1-dev libssl-dev pkg-config libvulkan1 mesa-vulkan-drivers libegl1 libgl1-mesa-dri
          mkdir -p "$RUNNER_TEMP/effectstrike-runtime"
          chmod 700 "$RUNNER_TEMP/effectstrike-runtime"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/effectstrike-runtime" >> "$GITHUB_ENV"
      - name: Install the repository's pinned Rust baseline
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup target add wasm32-unknown-unknown --toolchain 1.95.0
      - name: Fetch only locked official dependencies and pinned sources
        run: cargo fetch --locked
      - name: Run CPU renderer tests and require an executed Echo GPU comparison
        if: matrix.check == 'focused-render-echo'
        env:
          CARGO_NET_OFFLINE: 'true'
        run: |
          set -o pipefail
          cargo test --locked -p effectcraft-render --lib -- --test-threads=2 2>&1 | tee ci-evidence/render.log
          cargo test --locked -p effectcraft-gpu --lib tests_fx_noise::echo_after_star_burst_preserves_the_stars -- --exact --nocapture --test-threads=1 2>&1 | tee ci-evidence/echo.log
          grep -F 'effectcraft-gpu tests: adapter ' ci-evidence/echo.log
          if grep -F 'no GPU adapter' ci-evidence/echo.log; then exit 1; fi
          grep -F 'test result: ok. 1 passed; 0 failed;' ci-evidence/echo.log
      - name: Run the complete repository quality gate
        if: matrix.check == 'full-ci'
        env:
          CARGO_NET_OFFLINE: 'true'
        run: |
          set -o pipefail
          cargo run --locked --package xtask -- ci 2>&1 | tee ci-evidence/full-ci.log
      - name: Require unchanged dependency pins
        if: always()
        run: git diff --exit-code -- Cargo.toml Cargo.lock
      - name: Preserve exact-head check evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: effectstrike-${{ matrix.check }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ci-evidence/
          retention-days: 1
          if-no-files-found: error
