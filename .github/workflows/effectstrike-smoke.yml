name: EffectStrike bounded smoke

on:
  push:
    branches:
      - feature/desktop-identity-copy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-and-render:
    if: github.repository == 'Gerbzz/EffectStrike'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libgtk-3-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxcb1-dev libssl-dev pkg-config
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Build desktop and headless applications
        run: cargo +1.95.0 build --locked -p effectcraft -p effectcraft-cli
      - name: Create, import, reopen, and render a synthetic composition
        run: python3 scripts/ci_synthetic_render.py target/debug/effectcraft-cli smoke-output
      - name: Test headless CLI
        run: cargo +1.95.0 test --locked -p effectcraft-cli
      - name: Preserve one renderer frame for inspection
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: effectstrike-synthetic-render
          path: smoke-output/render.png
          retention-days: 1
          if-no-files-found: error
