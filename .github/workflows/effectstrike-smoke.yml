name: EffectStrike bounded smoke

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/effectstrike-smoke.yml
      - apps/effectcraft/src/main.rs
      - apps/effectcraft/src/appimage.rs
      - apps/effectcraft/Cargo.toml
      - assets/branding/EffectStrike-logo.png
      - Cargo.toml
      - Cargo.lock
      - apps/effectcraft/build.rs
      - assets/branding/icons/**
      - assets/branding/EffectStrike-logo.svg
      - xtask/**
      - scripts/check_product_icon_routes.py
      - scripts/check_product_icon_resources.py
      - scripts/test_product_icon_resources.py
      - packaging/linux/**
      - packaging/freebsd/package.sh
      - apps/effectcraft-web/web/index.html
      - apps/effectcraft-web/web/manifest.webmanifest
  push:
    branches:
      - feature/desktop-identity-copy
      - feature/effects-expression-proof
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-and-render:
    if: github.repository == 'Gerbzz/EffectStrike'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libgtk-3-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxcb1-dev libssl-dev pkg-config xvfb scrot libgl1-mesa-dri
          ldconfig -p | grep -F libxkbcommon-x11.so.0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Verify product exports, routing, attribution and web icon cache regression
        run: |
          cargo +1.95.0 run --locked -p xtask -- product-icons --check
          cargo +1.95.0 test --locked -p xtask
          cargo +1.95.0 run --locked -p xtask -- assets
          python3 scripts/check_product_icon_routes.py
          python3 scripts/check_product_icon_resources.py
          python3 -m unittest discover -s scripts -p test_product_icon_resources.py
      - name: Build desktop and headless applications
        run: cargo +1.95.0 build --locked -p effectcraft -p effectcraft-cli
      - name: Check public application identity
        shell: bash
        run: |
          target/debug/effectcraft --version | grep '^EffectStrike '
          target/debug/effectcraft-cli info --empty | grep '^EffectStrike '
      - name: Create, import, reopen, and render a synthetic composition
        run: python3 scripts/ci_synthetic_render.py target/debug/effectcraft-cli smoke-output
      - name: Test headless CLI
        run: cargo +1.95.0 test --locked -p effectcraft-cli
      - name: Test Linux desktop entry integration
        run: cargo +1.95.0 test --locked -p effectcraft appimage::tests
      - name: Test accepted runtime icon decoding
        run: cargo +1.95.0 test --locked -p effectcraft runtime_icon_decodes_the_product_logo
      - name: Launch and capture the actual desktop Home screen
        shell: bash
        run: |
          Xvfb :99 -screen 0 1280x800x24 -nolisten tcp > smoke-output/xvfb.log 2>&1 &
          server=$!
          trap 'kill "$app" "$server" 2>/dev/null || true' EXIT
          export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 WGPU_BACKEND=gl
          sleep 2
          target/debug/effectcraft --home > smoke-output/desktop.log 2>&1 &
          app=$!
          sleep 12
          if ! kill -0 "$app" 2>/dev/null; then
            cat smoke-output/desktop.log
            exit 1
          fi
          scrot -z smoke-output/home.png
          test -s smoke-output/home.png
      - name: Preserve actual renderer and desktop screenshots for inspection
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: effectstrike-hosted-smoke-images
          path: |
            smoke-output/render.png
            smoke-output/effect-before.png
            smoke-output/effect-after.png
            smoke-output/expression-after.png
            smoke-output/home.png
            smoke-output/desktop.log
            smoke-output/xvfb.log
          retention-days: 1
          if-no-files-found: warn
