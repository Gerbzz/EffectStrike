name: EffectStrike native product icon exports

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/effectstrike-product-icons.yml
      - assets/branding/**
      - xtask/**
      - Cargo.toml
      - Cargo.lock
      - scripts/check_product_icon_routes.py
      - scripts/check_product_icon_resources.py
      - scripts/test_product_icon_resources.py
      - packaging/**
      - apps/effectcraft/src/main.rs
      - apps/effectcraft/build.rs
      - apps/effectcraft-web/web/index.html
      - apps/effectcraft-web/web/manifest.webmanifest

permissions:
  contents: read

jobs:
  macos-iconutil:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out exact reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install existing pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Verify committed PNG and ICO exports and source routes
        run: |
          cargo +1.95.0 run --locked -p xtask -- product-icons --check
          cargo +1.95.0 test --locked -p xtask
          python3 scripts/check_product_icon_routes.py
          python3 scripts/check_product_icon_resources.py
          python3 -m unittest discover -s scripts -p test_product_icon_resources.py
      - name: Export and roundtrip ICNS with native iconutil
        run: |
          mkdir -p icon-evidence
          sw_vers > icon-evidence/platform.txt
          xcodebuild -version >> icon-evidence/platform.txt
          shasum -a 256 /usr/bin/iconutil >> icon-evidence/platform.txt
          cp -R assets/branding/icons/EffectStrike.iconset icon-evidence/expected.iconset
          cp assets/branding/icons/provenance.json icon-evidence/export-provenance.json
          iconutil -c icns -o icon-evidence/EffectStrike.icns assets/branding/icons/EffectStrike.iconset
          iconutil -c iconset -o icon-evidence/roundtrip.iconset icon-evidence/EffectStrike.icns
          git rev-parse HEAD > icon-evidence/source-head.txt
          shasum -a 256 assets/branding/EffectStrike-logo.png icon-evidence/EffectStrike.icns > icon-evidence/sha256.txt
          cargo +1.95.0 run --locked -p xtask -- product-icons --verify-iconset icon-evidence/roundtrip.iconset
          if [ -f assets/branding/icons/EffectStrike.icns ]; then
            iconutil -c iconset -o icon-evidence/committed.iconset assets/branding/icons/EffectStrike.icns
            cargo +1.95.0 run --locked -p xtask -- product-icons --verify-iconset icon-evidence/committed.iconset
          else
            echo 'Source-only export phase: ICNS artifact must be reviewed and committed before package completion.'
          fi
          git diff --exit-code -- Cargo.lock assets/branding
      - name: Retain native ICNS and provenance for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: effectstrike-native-iconutil-${{ matrix.os }}
          path: |
            icon-evidence/EffectStrike.icns
            icon-evidence/roundtrip.iconset/*.png
            icon-evidence/expected.iconset/*.png
            icon-evidence/export-provenance.json
            icon-evidence/source-head.txt
            icon-evidence/sha256.txt
            icon-evidence/platform.txt
          retention-days: 7
          if-no-files-found: error
      - name: Require reviewed committed ICNS before final package completion
        run: python3 scripts/check_product_icon_resources.py --require-icns
